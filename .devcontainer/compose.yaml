name: arcane-mechanics-core

services:
  mod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arcane-mechanics-core
    command: sleep infinity
    working_dir: /app
    ports:
      - "25565:25565"
    volumes:
      - type: bind
        source: ..
        target: /app
      - type: volume
        source: gradle-cache
        target: /root/.gradle

volumes:
  gradle-cache:
    name: neoforge-gradle-cache
