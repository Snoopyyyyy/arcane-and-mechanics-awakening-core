name: Build and publish

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'README.md'
      - '.devcontainer/**'
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compute version
        id: meta
        run: |
          BASE=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            VERSION="$BASE"
            TYPE=release
          else
            VERSION="$BASE-beta.$GITHUB_RUN_NUMBER"
            TYPE=beta
          fi

          PUBLISH=true
          if [ "$TYPE" = "release" ] && git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::notice::v$VERSION is already released. Bump mod_version in gradle.properties to publish a new release."
            PUBLISH=false
          fi

          PREV=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            CHANGELOG=$(git log "$PREV..HEAD" --no-merges --format='- %s')
          else
            CHANGELOG=$(git log -n 30 --no-merges --format='- %s')
          fi

          {
            echo "version=$VERSION"
            echo "type=$TYPE"
            echo "publish=$PUBLISH"
            echo "changelog<<CHANGELOG_EOF"
            echo "$CHANGELOG"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./gradlew build -Pmod_version=${{ steps.meta.outputs.version }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: amcore-${{ steps.meta.outputs.version }}
          path: output/*.jar

      - name: Publish to CurseForge
        if: steps.meta.outputs.publish == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: output/*.jar
          name: Arcane & Mechanics Core ${{ steps.meta.outputs.version }}
          version: ${{ steps.meta.outputs.version }}
          version-type: ${{ steps.meta.outputs.type }}
          changelog: ${{ steps.meta.outputs.changelog }}
          loaders: neoforge
          game-versions: 1.21.1
          java: 21
          dependencies: |
            kubejs(optional){curseforge:kubejs}
            mysticalagradditions(optional){curseforge:mystical-agradditions}

      - name: Tag release
        if: steps.meta.outputs.type == 'release' && steps.meta.outputs.publish == 'true'
        run: |
          git tag "v${{ steps.meta.outputs.version }}"
          git push origin "v${{ steps.meta.outputs.version }}"
