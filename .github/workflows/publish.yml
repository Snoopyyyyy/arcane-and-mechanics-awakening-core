name: Build and publish

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version and patch notes
        id: meta
        run: bash .github/scripts/release-meta.sh "$GITHUB_REF_NAME" build/release/changelog.md

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: amcore-${{ steps.meta.outputs.version }}
          path: output/*.jar

      - name: Publish to CurseForge
        if: steps.meta.outputs.publish == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: output/*.jar
          name: Arcane & Mechanics Core ${{ steps.meta.outputs.version }}
          version: ${{ steps.meta.outputs.version }}
          version-type: ${{ steps.meta.outputs.type }}
          changelog-file: build/release/changelog.md
          loaders: neoforge
          game-versions: 1.21.1
          java: 21
          dependencies: |
            create(required){curseforge:create}
            kubejs(optional){curseforge:kubejs}
            jei(optional){curseforge:jei}
            mysticalagradditions(optional){curseforge:mystical-agradditions}

      - name: Tag release
        if: steps.meta.outputs.type == 'release' && steps.meta.outputs.publish == 'true'
        run: |
          git tag "v${{ steps.meta.outputs.version }}"
          git push origin "v${{ steps.meta.outputs.version }}"
